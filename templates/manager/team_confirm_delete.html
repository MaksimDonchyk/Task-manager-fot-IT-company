{% extends "manager/base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Видалити команду "{{ object.name }}"?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Так, видалити</button>
    <a href="{% url 'manager:team-detail' object.pk %}" class="btn btn-secondary">Скасувати</a>
  </form>
</div>
{% endblock %}
