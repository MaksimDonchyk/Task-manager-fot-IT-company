{% extends "manager/base.html" %}

{% block title %} Реєстрація працівника {% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4 mt-4">
      <h2 class="text-center mb-4">Реєстрація в Task Manager</h2>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-success">Зареєструватися</button>
        </div>
      </form>

      <div class="text-center mt-3">
        <p>Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
