{% extends "manager/base.html" %}

{% block title %} Реєстрація працівника {% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="mb-4">Реєстрація нового працівника</h1>

        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Зареєструвати</button>
                <a href="{% url 'manager:worker-list' %}" class="btn btn-secondary">Скасувати</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
